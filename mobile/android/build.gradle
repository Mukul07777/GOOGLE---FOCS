// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Build outputs can live outside the project (set FOCS_ANDROID_BUILD, as build_apk.bat does): this folder sits in
// OneDrive, which locks and has damaged files that change as fast as a build's do.
def focsOut = System.getenv("FOCS_ANDROID_BUILD")
if (focsOut) {
    allprojects {
        layout.buildDirectory.set(file("${focsOut}/${project.name}"))
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
