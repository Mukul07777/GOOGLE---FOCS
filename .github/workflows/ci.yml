name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: pip install -r backend/requirements.txt pytest
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Web app checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0
      - name: Math rendering tests
        working-directory: frontend
        run: npm run test:math

  accessibility:
    name: Accessibility (axe, WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build the web app
        working-directory: frontend
        run: npm run build
      - name: Start Focs (empty database, no AI keys)
        working-directory: backend
        run: |
          DATABASE_URL=sqlite:////tmp/a11y.db STORAGE_DIR=/tmp/a11y python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
      - name: axe on the main pages, both themes, signed out and in
        working-directory: frontend
        run: npm run test:a11y

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t focs .
      - name: Run (production settings, empty database) and wait until healthy
        run: |
          docker run -d --name focs -p 8000:8000 -e ENV=production -e SECRET_KEY=ci-only-secret-key-that-is-long-enough-123 \
            -e DATABASE_URL=sqlite:////data/focs.db -e STORAGE_DIR=/data/storage focs
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && exit 0; sleep 3; done
          docker logs focs; exit 1
      - name: Runs as a non-root user and serves the web app
        run: |
          test "$(docker exec focs id -u)" != "0"
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
